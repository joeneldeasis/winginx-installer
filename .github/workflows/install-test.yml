name: Installer smoke test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2019
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            '.\install.ps1',
            '.\scripts\manage-php-extension.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Syntax errors in $file"
            }

            Write-Host "$file syntax ok"
          }

      - name: Run installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 `
            -InstallRoot C:\winginx-ci `
            -HttpPort 8080 `
            -ServerName localhost

      - name: Verify services
        shell: powershell
        run: |
          $services = Get-Service winginx-nginx, winginx-php -ErrorAction Stop
          $services | Format-Table Name, Status, StartType
          $failed = @($services | Where-Object { $_.Status -ne 'Running' })
          if ($failed.Count -gt 0) {
            throw "Services not running: $($failed.Name -join ', ')"
          }

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 20
          Write-Host $response.Content

          if ($response.StatusCode -ne 200) {
            throw "Unexpected status code: $($response.StatusCode)"
          }

          if ($response.Content -notmatch 'winginx ok') {
            throw "Health page did not contain 'winginx ok'"
          }

          if ($response.Content -notmatch 'PHP 8\.2') {
            throw "Health page did not report PHP 8.2"
          }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winginx-ci-logs-${{ matrix.os }}
          path: |
            C:\winginx-ci\nginx\logs\
            C:\winginx-ci\php\logs\
          if-no-files-found: ignore
