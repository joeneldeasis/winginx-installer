name: windows-2022

# Windows Server 2022 Datacenter matches this runner (windows-2022).
on:
  workflow_dispatch:
  push:
    branches:
      - fix/php2shell-ws2022-safe
    paths:
      - install.ps1
      - scripts/**
      - config/**
      - .github/workflows/**

jobs:
  install:
    uses: ./.github/workflows/install-smoke.yml
    with:
      os: windows-2022
