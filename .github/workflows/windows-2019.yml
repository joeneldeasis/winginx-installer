name: windows-2019

# Closest GitHub-hosted runner to Windows Server 2016 (Windows PowerShell 5.1).
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/php2shell-patch
      - fix/install-in-place-upgrade
    paths:
      - install.ps1
      - .github/workflows/**

jobs:
  install:
    uses: ./.github/workflows/install-smoke.yml
    with:
      os: windows-2019
