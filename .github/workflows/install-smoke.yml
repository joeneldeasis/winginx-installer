name: install-smoke

on:
  workflow_call:
    inputs:
      os:
        description: GitHub-hosted Windows runner label
        required: true
        type: string

jobs:
  install:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            '.\install.ps1',
            '.\scripts\manage-php-extension.ps1',
            '.\scripts\patch-php-php2shell.ps1',
            '.\scripts\lib\PhpReleaseSecurity.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Syntax errors in $file"
            }

            Write-Host "$file syntax ok"
          }

      - name: Run installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 `
            -InstallRoot C:\winginx-ci `
            -HttpPort 8080 `
            -ServerName localhost

      - name: Verify services
        shell: powershell
        run: |
          $services = Get-Service winginx-nginx, winginx-php -ErrorAction Stop
          $services | Format-Table Name, Status, StartType
          $failed = @($services | Where-Object { $_.Status -ne 'Running' })
          if ($failed.Count -gt 0) {
            throw "Services not running: $($failed.Name -join ', ')"
          }

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 20
          Write-Host $response.Content

          if ($response.StatusCode -ne 200) {
            throw "Unexpected status code: $($response.StatusCode)"
          }

          if ($response.Content -notmatch 'winginx ok') {
            throw "Health page did not contain 'winginx ok'"
          }

          if ($response.Content -notmatch 'PHP 8\.2') {
            throw "Health page did not report PHP 8.2"
          }

      - name: Verify PHP tooling
        shell: powershell
        run: |
          $phpExe = 'C:\winginx-ci\php\php.exe'
          $composerPhar = 'C:\winginx-ci\tools\composer\composer.phar'
          $binDir = 'C:\winginx-ci\tools\bin'

          if (-not (Test-Path $phpExe)) { throw "Missing $phpExe" }
          if (-not (Test-Path $composerPhar)) { throw "Missing $composerPhar" }
          if (-not (Test-Path "$binDir\composer.cmd")) { throw 'Missing composer.cmd' }
          if (-not (Test-Path "$binDir\artisan.cmd")) { throw 'Missing artisan.cmd' }
          if (-not (Test-Path 'C:\winginx-ci\tools\php-console.ps1')) { throw 'Missing php-console.ps1' }

          $previousErrorAction = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'SilentlyContinue'
            $phpVersion = (& $phpExe -v 2>&1 | ForEach-Object {
              if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.ToString() } else { "$_" }
            }) -join [Environment]::NewLine
            $composerOutput = @(& $phpExe -c 'C:\winginx-ci\php\php.ini' $composerPhar -V 2>&1 | ForEach-Object {
              if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.ToString() } else { "$_" }
            })
          }
          finally {
            $ErrorActionPreference = $previousErrorAction
          }

          $phpVersion = $phpVersion.Trim()
          Write-Host $phpVersion
          if ($phpVersion -notmatch 'PHP 8\.2') {
            throw 'php -v did not report PHP 8.2'
          }

          if ($LASTEXITCODE -ne 0) {
            throw "composer -V failed with exit code $LASTEXITCODE."
          }

          $composerVersion = $composerOutput | Where-Object { $_ -match '^Composer version ' } | Select-Object -First 1
          Write-Host $composerVersion
          if (-not $composerVersion) {
            throw "composer -V failed. Output:`n$($composerOutput -join [Environment]::NewLine)"
          }

      - name: Test php2shell patch script
        shell: powershell
        run: |
          $installRoot = 'C:\winginx-ci'
          $phpRoot = Join-Path $installRoot 'php'
          $phpIniPath = Join-Path $phpRoot 'php.ini'
          $securityConfig = Import-PowerShellDataFile -Path '.\config\php-security.psd1'
          $minimumVersion = [string]$securityConfig.php2shell['8.2']

          if ([string]::IsNullOrWhiteSpace($minimumVersion)) {
            throw 'php2shell minimum for PHP 8.2 was not defined in config\php-security.psd1.'
          }

          $marker = '; winginx-ci-patch-test'
          Add-Content -Path $phpIniPath -Value $marker
          (Get-Content -Path $phpIniPath) -replace '(?m)^session\.upload_progress\.enabled=.*', 'session.upload_progress.enabled=1' |
            Set-Content -Path $phpIniPath

          powershell -ExecutionPolicy Bypass -File .\scripts\patch-php-php2shell.ps1 `
            -InstallRoot $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Idempotent php2shell patch failed with exit code $LASTEXITCODE."
          }

          $iniText = Get-Content -Path $phpIniPath -Raw
          if ($iniText -notmatch '(?m)^session\.upload_progress\.enabled=0\s*$') {
            throw 'php.ini is missing session.upload_progress.enabled=0 after idempotent patch.'
          }

          if ($iniText -notmatch [regex]::Escape($marker)) {
            throw 'php.ini lost the winginx-ci patch marker after idempotent patch.'
          }

          powershell -ExecutionPolicy Bypass -File .\scripts\patch-php-php2shell.ps1 `
            -InstallRoot $installRoot `
            -SimulateInstalledVersion '8.2.34'
          if ($LASTEXITCODE -ne 0) {
            throw "Simulated php2shell upgrade patch failed with exit code $LASTEXITCODE."
          }

          $phpVersionLine = (& (Join-Path $phpRoot 'php-cgi.exe') -v 2>&1 | Select-Object -First 1)
          Write-Host $phpVersionLine
          $LASTEXITCODE = 0
          if ($phpVersionLine -notmatch "PHP $([regex]::Escape($minimumVersion))") {
            throw "php-cgi -v did not report PHP $minimumVersion after simulated upgrade patch."
          }

          $services = Get-Service winginx-nginx, winginx-php -ErrorAction Stop
          $failed = @($services | Where-Object { $_.Status -ne 'Running' })
          if ($failed.Count -gt 0) {
            throw "Services not running after patch: $($failed.Name -join ', ')"
          }

          Start-Sleep -Seconds 3
          $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -UseBasicParsing -TimeoutSec 20
          Write-Host $response.Content
          if ($response.Content -notmatch "PHP $([regex]::Escape($minimumVersion))") {
            throw "Health page did not report PHP $minimumVersion after patch."
          }

          $iniAfterUpgrade = Get-Content -Path $phpIniPath -Raw
          if ($iniAfterUpgrade -notmatch [regex]::Escape($marker)) {
            throw 'php.ini lost the winginx-ci patch marker after upgrade patch.'
          }

          Write-Host 'php2shell patch workflow checks passed.'
          exit 0

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winginx-ci-logs-${{ inputs.os }}
          path: |
            C:\winginx-ci\nginx\logs\
            C:\winginx-ci\php\logs\
          if-no-files-found: ignore
